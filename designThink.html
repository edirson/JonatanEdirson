        html, body { background: transparent !important; }
        svg { overflow: visible; }
        .stroke-premium { stroke: #E5004F; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .stroke-thin { stroke: #E5004F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        @keyframes breatheA {
          0%,100% { transform: scale(1) translateZ(0); }
          50% { transform: scale(1.035) translateZ(0); }
        }
        @keyframes breatheB {
          0%,100% { transform: scale(0.985) translateZ(0); }
          50% { transform: scale(1.015) translateZ(0); }
        }
        @keyframes loupeDrift {
          0% { transform: translate(0px, 0px) rotate(0deg); }
          35% { transform: translate(-5px, 6px) rotate(-3deg); }
          70% { transform: translate(4px, -3px) rotate(2deg); }
          100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        @keyframes pencilWrite {
          0%,100% { transform: translate(0px, 0px) rotate(-14deg); }
          50% { transform: translate(1.2px, -1.8px) rotate(-10deg); }
        }
        @keyframes lineDraw {
          0% { stroke-dashoffset: 32; opacity: 0.4; }
          50% { stroke-dashoffset: 0; opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes lineDraw2 {
          0%,20% { stroke-dashoffset: 28; opacity: 0; }
          60% { stroke-dashoffset: 0; opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes bulbGlow {
          0%,100% { filter: drop-shadow(0 0 0 rgba(229,0,79,0)); }
          50% { filter: drop-shadow(0 0 10px rgba(229,0,79,0.20)); }
        }
        @keyframes filamentPulse {
          0%,100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }
        @keyframes raysRotate {
          0% { transform: rotate(0deg) scale(0.98); }
          50% { transform: rotate(180deg) scale(1.06); }
          100% { transform: rotate(360deg) scale(0.98); }
        }
        @keyframes rayPulse {
          0%,100% { opacity: 0.55; }
          50% { opacity: 1; }
        }
        @keyframes gearRotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes cubeFloat {
          0%,100% { transform: translateY(0px); }
          50% { transform: translateY(-5px); }
        }
        @keyframes cubeTilt {
          0%,100% { transform: rotate(-4deg) scale(1); }
          50% { transform: rotate(4deg) scale(1.03); }
        }
        @keyframes checkDraw {
          0% { stroke-dashoffset: 28; }
          25% { stroke-dashoffset: 0; }
          75% { stroke-dashoffset: 0; }
          100% { stroke-dashoffset: 28; }
        }
        @keyframes clipTilt {
          0%,100% { transform: rotate(-1deg); }
          50% { transform: rotate(1deg); }
        }

        .anim-breathe-a { animation: breatheA 3.8s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: 30% 50%; }
        .anim-breathe-b { animation: breatheB 3.8s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: 70% 50%; }
        .anim-loupe { animation: loupeDrift 6.5s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: center; }
        .anim-pencil { animation: pencilWrite 2.8s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: 85% 20%; }
        .anim-line1 { stroke-dasharray: 32; animation: lineDraw 3.2s cubic-bezier(0.4,0,0.2,1) infinite; }
        .anim-line2 { stroke-dasharray: 28; animation: lineDraw2 3.2s cubic-bezier(0.4,0,0.2,1) infinite; }
        .anim-line3 { stroke-dasharray: 24; animation: lineDraw2 3.2s cubic-bezier(0.4,0,0.2,1) 0.3s infinite; }
        .anim-bulb { animation: bulbGlow 3.5s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: center; }
        .anim-filament { animation: filamentPulse 1.8s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: center; }
        .anim-rays { animation: raysRotate 12s linear infinite; transform-origin: 36px 34px; }
        .anim-ray { animation: rayPulse 2.2s cubic-bezier(0.4,0,0.2,1) infinite; }
        .anim-gear { animation: gearRotate 20s linear infinite; transform-origin: 36px 36px; }
        .anim-cube-float { animation: cubeFloat 3.8s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: center; }
        .anim-cube-tilt { animation: cubeTilt 3.8s cubic-bezier(0.4,0,0.2,1) infinite; transform-origin: center; }
        .anim-check { stroke-dasharray: 28; animation: checkDraw 3s cubic-bezier(0.4,0,0.2,1) infinite; }

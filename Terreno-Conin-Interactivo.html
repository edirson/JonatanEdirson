        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        :root{
          --navy:#0A1931;
          --navy-2:#122A5E;
          --copper:#E67E22;
          --orange:#FF8C42;
          --paper:#F8F9FB;
        }
        *{font-family:'Inter', system-ui, sans-serif;}
        .mono{font-family:'JetBrains Mono', monospace;}
        @keyframes blueprint-draw{
          0%{stroke-dashoffset:1200;}
          100%{stroke-dashoffset:0;}
        }
        @keyframes float{
          0%,100%{transform:translateY(0)}
          50%{transform:translateY(-6px)}
        }
        @keyframes shimmer{
          0%{background-position:-200% 0}
          100%{background-position:200% 0}
        }
        @keyframes border-glow{
          0%,100%{box-shadow:0 0 0 1px rgba(230,126,34,0.15), 0 0 20px rgba(230,126,34,0.08)}
          50%{box-shadow:0 0 0 1px rgba(230,126,34,0.35), 0 0 32px rgba(255,140,66,0.18)}
        }
        @keyframes pulse-dot{
          0%{transform:scale(1); opacity:1}
          50%{transform:scale(1.6); opacity:0.6}
          100%{transform:scale(2.2); opacity:0}
        }
        @keyframes grid-move{
          0%{background-position:0 0}
          100%{background-position:40px 40px}
        }
        .blueprint-grid{
          background-image:
            linear-gradient(rgba(18,42,94,0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(18,42,94,0.07) 1px, transparent 1px),
            linear-gradient(rgba(18,42,94,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(18,42,94,0.04) 1px, transparent 1px);
          background-size:40px 40px, 40px 40px, 8px 8px, 8px 8px;
          animation:grid-move 12s linear infinite;
        }
        .noise::before{
          content:'';
          position:absolute; inset:0;
          background-image:radial-gradient(rgba(255,255,255,0.6) 0.8px, transparent 0.8px);
          background-size:14px 14px;
          opacity:0.25; pointer-events:none; mix-blend-mode:overlay;
        }
        .reveal{opacity:0; transform:translateY(24px); transition:all 0.8s cubic-bezier(.16,1,.3,1);}
        .reveal.is-visible{opacity:1; transform:translateY(0);}
        .shimmer-text{
          background:linear-gradient(90deg, #E67E22 0%, #FF8C42 25%, #FFD07A 50%, #FF8C42 75%, #E67E22 100%);
          background-size:200% 100%;
          -webkit-background-clip:text; background-clip:text; color:transparent;
          animation:shimmer 3.5s linear infinite;
        }
        .glass{
          background:rgba(255,255,255,0.72);
          backdrop-filter:blur(18px) saturate(1.2);
          -webkit-backdrop-filter:blur(18px) saturate(1.2);
          border:1px solid rgba(10,25,49,0.08);
        }
        .glass-dark{
          background:linear-gradient(135deg, rgba(10,25,49,0.92) 0%, rgba(18,42,94,0.88) 100%);
          backdrop-filter:blur(22px);
          border:1px solid rgba(255,255,255,0.08);
        }
        .pill{
          transition:all 0.35s cubic-bezier(.16,1,.3,1);
        }
        .pill:hover{
          transform:translateY(-3px) scale(1.02);
